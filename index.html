<title>Word Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Mochiy+Pop+One&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #FEF6F8;
  --surface: #FFFFFF;
  --ink: #1E1E1E;
  --muted: #7A6E92;
  --line: #F0DEE6;
  --accent: #F14A41;
  --accent-ink: #FFFFFF;
  --accent-soft: #FDE3E1;
  --purple: #45277C;
  --purple-soft: #EDE7F7;
  --blue: #2A59AB;
  --blue-soft: #E3EBF7;
  --gold: #AD7A00;
  --gold-soft: #FFF3D1;
  --miss: #C23930;
  --miss-soft: #FBE3E1;
  --ok: #1E7A4D;
  --ok-soft: #DDF3E7;
  --display: "Poppins", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --playful: "Mochiy Pop One", var(--display);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #211A2C;
    --surface: #2C2338;
    --ink: #F7EEF2;
    --muted: #C6B8DC;
    --line: #4A3C5C;
    --accent: #FF7A70;
    --accent-ink: #2B0D0A;
    --accent-soft: #452A28;
    --purple: #B6A2E8;
    --purple-soft: #3A2E54;
    --blue: #8FB2E8;
    --blue-soft: #263655;
    --gold: #FABE0D;
    --gold-soft: #453418;
    --miss: #FF8A80;
    --miss-soft: #3D1F27;
    --ok: #6FD9A3;
    --ok-soft: #153A2B;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #211A2C;
  --surface: #2C2338;
  --ink: #F7EEF2;
  --muted: #C6B8DC;
  --line: #4A3C5C;
  --accent: #FF7A70;
  --accent-ink: #2B0D0A;
  --accent-soft: #452A28;
  --purple: #B6A2E8;
  --purple-soft: #3A2E54;
  --blue: #8FB2E8;
  --blue-soft: #263655;
  --gold: #FABE0D;
  --gold-soft: #453418;
  --miss: #FF8A80;
  --miss-soft: #3D1F27;
  --ok: #6FD9A3;
  --ok-soft: #153A2B;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 28px 48px;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; }

.mast { display: grid; grid-template-columns: 1fr auto; align-items: start; gap: 6px 14px; }
.mast .masttext { display: grid; gap: 6px; }
.mast .cskmark { width: auto; height: clamp(6.6rem, 24vw, 9.6rem); object-fit: contain; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 8vw, 3.2rem); line-height: 1; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h1 .lens { color: var(--accent); }
h2 { font-family: var(--display); font-weight: 600; font-size: 1.5rem; line-height: 1.2; margin: 0; text-wrap: balance; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 60ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; }
.field { display: grid; gap: 8px; }
label, .label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
input[type="text"], textarea {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%;
}
textarea { resize: vertical; min-height: 84px; }
input[type="text"]::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.8; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.btn {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 12px 18px;
  border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.small { padding: 7px 12px; font-size: 14px; font-weight: 500; }
.btn:disabled, .choice:disabled { opacity: 0.55; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }

.rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rule { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; background: var(--bg); }
.rule b { font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.rule span { font-size: 13px; color: var(--muted); }
.rule.ra b { color: var(--purple); } .rule.r3 b { color: var(--accent); } .rule.r1 b { color: var(--gold); }
.note { font-size: 14px; color: var(--muted); }

.summary { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between; }
.summary .big { font-family: var(--mono); font-size: 14px; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.summary .big b { font-size: 22px; }
.rankline { font-family: var(--display); font-weight: 800; font-size: 1.3rem; color: var(--purple); }

.csk-foot { display: grid; gap: 4px; justify-items: start; padding-top: 4px; }
.csk-foot .brand { font-family: var(--playful); font-size: 13px; color: var(--purple); letter-spacing: 0.02em; }
.csk-foot .tagline { font-size: 12px; color: var(--muted); }
.csk-foot .contact { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pips { display: flex; gap: 6px; flex-wrap: wrap; }
.pip {
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line);
  display: grid; place-items: center; font-family: var(--mono); font-size: 10px; color: var(--muted);
}
.pip.now { border-color: var(--accent); color: var(--accent); }
.pip.p3 { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.pip.p0 { background: var(--miss-soft); border-color: var(--miss); color: var(--miss); }
.score { font-family: var(--mono); font-size: 14px; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.score b { font-size: 20px; }

.case { position: relative; padding-top: 28px; }
.tab {
  position: absolute; top: -13px; left: 16px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em;
  background: var(--ink); color: var(--bg); padding: 4px 12px; border-radius: 6px;
}
.instr { color: var(--muted); font-size: 14px; }
.clue { font-family: var(--display); font-weight: 600; font-size: clamp(1.15rem, 4.4vw, 1.5rem); line-height: 1.35; text-wrap: balance; }
.clue .wordfocus { color: var(--purple); font-weight: 800; }
.clue .misspelled { color: var(--miss); text-decoration: line-through wavy; font-style: italic; }
.clue .blank { border-bottom: 2px dashed var(--muted); padding: 0 4px; }
.partlabel { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.part { display: grid; gap: 8px; }
.choices { display: grid; gap: 10px; }
.choices.cols2 { grid-template-columns: repeat(2, 1fr); }
.choice {
  font: inherit; text-align: left; color: var(--ink); background: var(--bg); cursor: pointer;
  border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.picked { border-color: var(--purple); background: var(--purple-soft); }
.choice.right { background: var(--ok-soft); border-color: var(--ok); cursor: default; }
.choice.wrong { background: var(--miss-soft); border-color: var(--miss); cursor: default; }
.notice, .explainbox { border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.notice.miss { background: var(--miss-soft); border: 1px solid var(--miss); }
.explainbox { background: var(--accent-soft); border: 1px solid var(--accent); }

.verdict { display: grid; gap: 12px; }
.stamp {
  justify-self: start; font-family: var(--mono); font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase;
  border: 2.5px solid currentColor; border-radius: 6px; padding: 4px 12px; transform: rotate(-2deg);
}
.stamp.p3 { color: var(--ok); } .stamp.p0 { color: var(--miss); }

.final { display: grid; gap: 16px; }
.rank { font-family: var(--display); font-weight: 800; font-size: clamp(1.8rem, 7vw, 2.6rem); line-height: 1.05; }
.bigscore { font-family: var(--mono); font-size: 15px; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; color: var(--muted); }
.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; background: var(--bg); }
.stat b { font-family: var(--mono); font-size: 18px; }
.stat span { font-size: 12px; color: var(--muted); }
.syncline { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.syncline.ok { color: var(--ok); }
.syncline.failed { color: var(--miss); }

@media (max-width: 460px) {
  .rules { grid-template-columns: 1fr; }
  .statgrid { grid-template-columns: 1fr 1fr; }
  .choices.cols2 { grid-template-columns: 1fr; }
  .card { padding: 16px; }
}
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
  /* ======================================================================
   * CONFIG
   * Paste the Google Apps Script "Web app" URL here once it is deployed
   * (see the setup notes given alongside this file). Until this is set,
   * results are still scored and shown on screen, but are not saved
   * anywhere outside the student's own browser.
   * ==================================================================== */
  var SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbz1LXTFnW7Momn-PXl893InSN5YooC6FfKojqlPhwTXTSxXSm1ANaLSYkOEp2zXLP8D/exec';

  var POS_OPTIONS = ['Noun', 'Verb', 'Adjective', 'Adverb'];

  /* Each question focuses on a word CSK students often misspell.
   * mode: 'classify'    - word is shown correctly spelled; student names its part of speech.
   *       'spell_select' - student picks the correct spelling from 4 options, then names the part of speech.
   *       'spell_type'   - student types the correct spelling of a bracketed misspelling, then names the part of speech.
   * pos: index into POS_OPTIONS of the correct answer. */
  var QUESTIONS = [
    { mode: 'classify', pre: 'The ', word: 'government', post: ' announced new funding for local schools.', pos: 0,
      explain: '"Government" names a thing (the group that runs a country) — that makes it a noun.' },
    { mode: 'classify', pre: 'We must protect the natural ', word: 'environment', post: '.', pos: 0,
      explain: '"Environment" names the natural world around us — a noun.' },
    { mode: 'spell_select', pre: 'We ate dinner at a lovely ', post: ' near the beach.',
      spellOptions: ['restaurant', 'resturant', 'restaraunt', 'restuarant'], spellCorrect: 0, pos: 0,
      explain: '"Restaurant" is a place — a noun. Remember: res-tau-rant.' },
    { mode: 'spell_type', pre: 'The shop owner runs a small ', misspelled: 'bisness', post: '.', word: 'business', pos: 0,
      explain: '"Business" names a thing a person runs — a noun. Remember the "-siness" ending.' },
    { mode: 'spell_select', pre: 'Our ', post: ' waved to us from across the street.',
      spellOptions: ['nieghbour', 'neighbour', 'neighbuor', 'neighber'], spellCorrect: 1, pos: 0,
      explain: '"Neighbour" names a person — a noun. Spelling tip: nei-ghbour.' },
    { mode: 'classify', pre: 'I ', word: 'believe', post: ' you are telling the truth.', pos: 1,
      explain: '"Believe" is an action of the mind — a verb.' },
    { mode: 'spell_select', pre: 'Did you ', post: ' my message yesterday?',
      spellOptions: ['recieve', 'receive', 'receeve', 'recive'], spellCorrect: 1, pos: 1,
      explain: '"Receive" is an action — a verb. Spelling tip: "i" before "e" except after "c" — re-ceive.' },
    { mode: 'spell_type', pre: 'Accidents often ', misspelled: 'occor', post: ' at this busy junction.', word: 'occur', pos: 1,
      explain: '"Occur" is an action (to happen) — a verb. Spelling tip: double "c", single "r" — o-c-c-u-r.' },
    { mode: 'classify', pre: 'Loud burps may ', word: 'embarrass', post: ' you in public.', pos: 1,
      explain: '"Embarrass" is an action that happens to someone — a verb.' },
    { mode: 'spell_select', pre: 'Can you ', post: ' a good book for me?',
      spellOptions: ['reccomend', 'recomend', 'reccommend', 'recommend'], spellCorrect: 3, pos: 1,
      explain: '"Recommend" is an action — a verb. Spelling tip: one "c", two "m"s — rec-ommend.' },
    { mode: 'classify', pre: 'The sunset over the sea was ', word: 'beautiful', post: '.', pos: 2,
      explain: '"Beautiful" describes the sunset — an adjective.' },
    { mode: 'spell_type', pre: 'It is ', misspelled: 'neccessary', post: ' to bring an umbrella today.', word: 'necessary', pos: 2,
      explain: '"Necessary" describes something needed — an adjective. Spelling tip: one "c", two "s"s — nec-ess-ary.' },
    { mode: 'spell_select', pre: 'She was a ', post: ' student in every subject.',
      spellOptions: ['succesful', 'successfull', 'succesfull', 'successful'], spellCorrect: 3, pos: 2,
      explain: '"Successful" describes the student — an adjective. Spelling tip: double "c", double "s", single "l".' },
    { mode: 'classify', pre: 'She is a confident and ', word: 'independent', post: ' thinker.', pos: 2,
      explain: '"Independent" describes the thinker — an adjective.' },
    { mode: 'spell_type', pre: 'The new mall is very ', misspelled: 'convienient', post: ' for shopping.', word: 'convenient', pos: 2,
      explain: '"Convenient" describes the mall — an adjective. Spelling tip: "e" before "n" — con-ven-ient.' }
  ];
  var TOTAL = QUESTIONS.length;

  var app = document.getElementById('app');

  var S = {
    phase: 'start', id: '', name: '', idErr: false, nameErr: false,
    qi: 0, items: [], tStart: 0, qShownAt: 0,
    part1: null, typedDraft: '', part2: null, busy: false,
    last: null, syncStatus: null
  };

  /* ---------- helpers ---------- */
  function h(tag, attrs) {
    var e = document.createElement(tag);
    var a = attrs || {};
    Object.keys(a).forEach(function (k) {
      var v = a[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') e.className = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++) {
        var kid = kids[j];
        if (kid === null || kid === undefined || kid === false) continue;
        e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      }
    }
    return e;
  }
  function norm(s) { return String(s).trim().toLowerCase().replace(/\s+/g, ' '); }
  function curQ() { return QUESTIONS[S.qi]; }
  function rankFor(score) {
    if (score >= 14) return 'Chief Wordsmith';
    if (score >= 11) return 'Inspector';
    if (score >= 7) return 'Sleuth';
    return 'Rookie Detective';
  }

  /* ---------- flow ---------- */
  function startQuiz() {
    var id = norm(S.id), name = norm(S.name);
    S.idErr = !id; S.nameErr = !name;
    if (S.idErr || S.nameErr) { render(); return; }
    S.id = S.id.trim(); S.name = S.name.trim();
    S.qi = 0; S.items = []; S.tStart = Date.now();
    nextQuestion();
  }
  function nextQuestion() {
    S.part1 = null; S.part2 = null; S.typedDraft = ''; S.busy = false;
    S.qShownAt = Date.now(); S.phase = 'quiz'; render();
  }
  function canSubmit() {
    var q = curQ();
    if (q.mode === 'classify') return S.part2 !== null;
    if (q.mode === 'spell_select') return S.part1 !== null && S.part2 !== null;
    if (q.mode === 'spell_type') return norm(S.typedDraft).length > 0 && S.part2 !== null;
    return false;
  }
  function submitAnswer() {
    if (!canSubmit()) return;
    var q = curQ(), timeSec = Math.round((Date.now() - S.qShownAt) / 100) / 10;
    var part1ok = true;
    if (q.mode === 'spell_select') part1ok = S.part1 === q.spellCorrect;
    else if (q.mode === 'spell_type') part1ok = norm(S.typedDraft) === norm(q.word);
    var part2ok = S.part2 === q.pos;
    var correct = part1ok && part2ok;
    S.items.push({ qi: S.qi, mode: q.mode, part1ok: part1ok, part2ok: part2ok, correct: correct, timeSec: timeSec });
    S.last = { correct: correct, part1ok: part1ok, part2ok: part2ok };
    S.phase = 'feedback'; render();
  }
  function advance() {
    S.qi += 1;
    if (S.qi >= TOTAL) finishQuiz(); else nextQuestion();
  }

  function finishQuiz() {
    var score = S.items.filter(function (it) { return it.correct; }).length;
    var totalSec = S.items.reduce(function (a, it) { return a + it.timeSec; }, 0);
    var fastest = S.items.reduce(function (a, it) { return Math.min(a, it.timeSec); }, Infinity);
    var slowest = S.items.reduce(function (a, it) { return Math.max(a, it.timeSec); }, 0);
    S.result = { score: score, totalSec: Math.round(totalSec * 10) / 10,
      avgSec: Math.round((totalSec / TOTAL) * 10) / 10, fastest: fastest, slowest: slowest };
    S.phase = 'done'; S.syncStatus = SHEET_ENDPOINT ? 'sending' : 'nosync'; render();
    if (SHEET_ENDPOINT) sendToSheet(score, totalSec);
  }

  function sendToSheet(score, totalSec) {
    var payload = {
      id: S.id, name: S.name, score: score, total: TOTAL,
      totalSec: Math.round(totalSec * 10) / 10,
      submittedAt: new Date().toISOString(),
      items: S.items.map(function (it) { return { correct: it.correct, timeSec: it.timeSec }; })
    };
    try {
      fetch(SHEET_ENDPOINT, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(function () {
        S.syncStatus = 'ok'; render();
      }, function () {
        S.syncStatus = 'failed'; render();
      });
    } catch (e) { S.syncStatus = 'failed'; render(); }
  }

  function playAgain() { S.qi = 0; S.items = []; S.tStart = Date.now(); nextQuestion(); }
  function switchStudent() { S.id = ''; S.name = ''; S.idErr = false; S.nameErr = false; S.phase = 'start'; render(); }

  /* ---------- shared chrome ---------- */
  function masthead() {
    return h('header', { class: 'mast' },
      h('div', { class: 'masttext' },

  }
  function cskFooter() {
    return h('div', { class: 'csk-foot' },
      h('div', { class: 'brand' }, 'C-Suite Kids (CSK) · Training Future Leaders'),
      h('div', { class: 'tagline' }, 'Structured thinking for better writing & reading.'),
      h('div', { class: 'contact' }, 'www.c-suite-kids.com · WhatsApp +6 017 392 9915'));
  }
  function pips() {
    var out = [];
    for (var i = 0; i < TOTAL; i++) {
      var it = S.items[i], cls = 'pip';
      if (it) cls += it.correct ? ' p3' : ' p0';
      else if (i === S.items.length && S.phase === 'quiz') cls += ' now';
      out.push(h('span', { class: cls }, String(i + 1)));
    }
    return h('div', { class: 'pips' }, out);
  }
  function scorebar() {
    var right = S.items.filter(function (it) { return it.correct; }).length;
    return h('div', { class: 'bar' }, pips(),
      h('div', { class: 'score' }, h('b', null, right), ' / ' + TOTAL));
  }

  /* ---------- views ---------- */
  function viewStart() {
    return [
      masthead(),
      h('p', { class: 'lede' }, 'Stage 1 · Grammar Patrol — 15 questions on nouns, verbs and adjectives, built from the words CSK students most often misspell.'),
      h('section', { class: 'card' },
        h('div', { class: 'rules' },
          h('div', { class: 'rule ra' }, h('b', null, '15'), h('span', null, 'questions this stage')),
          h('div', { class: 'rule r1' }, h('b', null, '3'), h('span', null, 'word types: noun, verb, adjective')),
          h('div', { class: 'rule r3' }, h('b', null, '⏱'), h('span', null, 'speed is tracked per question'))),
        h('p', { class: 'note' }, 'Enter the ID your teacher gave you and your name, then start. One attempt per question — read carefully.'),
        h('div', { class: 'field' },
          h('label', null, 'Your ID'),
          h('input', { type: 'text', id: 'idinput', maxlength: '20', placeholder: 'e.g. CSK-07', value: S.id, autocomplete: 'off',
            oninput: function (e) { S.id = e.target.value; } }),
          S.idErr ? h('div', { class: 'notice miss' }, 'Please type the ID your teacher gave you.') : null),
        h('div', { class: 'field' },
          h('label', null, 'Your name'),
          h('input', { type: 'text', id: 'nameinput', maxlength: '40', placeholder: 'First and last name', value: S.name, autocomplete: 'off',
            onkeydown: function (e) { if (e.key === 'Enter') startQuiz(); },
            oninput: function (e) { S.name = e.target.value; } }),
          S.nameErr ? h('div', { class: 'notice miss' }, 'Please type your name.') : null),
        h('button', { class: 'btn', type: 'button', onclick: startQuiz }, 'Start Stage 1')),
      cskFooter()
    ];
  }

  function wordClue(q) {
    if (q.mode === 'classify') {
      return h('p', { class: 'clue' }, q.pre, h('span', { class: 'wordfocus' }, q.word), q.post);
    }
    if (q.mode === 'spell_select') {
      return h('p', { class: 'clue' }, q.pre, h('span', { class: 'blank' }, '______'), q.post);
    }
    return h('p', { class: 'clue' }, q.pre, h('span', { class: 'misspelled' }, q.misspelled), q.post);
  }

  function viewQuiz() {
    var q = curQ();
    var parts = [];

    if (q.mode === 'spell_select') {
      parts.push(h('div', { class: 'part' },
        h('div', { class: 'partlabel' }, 'Part 1 · Choose the correct spelling'),
        h('div', { class: 'choices cols2' }, q.spellOptions.map(function (opt, i) {
          return h('button', { class: 'choice' + (S.part1 === i ? ' picked' : ''), type: 'button',
            onclick: function () { S.part1 = i; render(); } }, opt);
        }))));
    } else if (q.mode === 'spell_type') {
      parts.push(h('div', { class: 'part' },
        h('div', { class: 'partlabel' }, 'Part 1 · Type the correct spelling'),
        h('input', { type: 'text', id: 'spellinput', maxlength: '30', placeholder: 'Type the word', value: S.typedDraft,
          autocomplete: 'off', oninput: function (e) { S.typedDraft = e.target.value; render(); } })));
    }

    parts.push(h('div', { class: 'part' },
      h('div', { class: 'partlabel' }, (q.mode === 'classify' ? '' : 'Part 2 · ') + 'What part of speech is it?'),
      h('div', { class: 'choices cols2' }, POS_OPTIONS.map(function (opt, i) {
        return h('button', { class: 'choice' + (S.part2 === i ? ' picked' : ''), type: 'button',
          onclick: function () { S.part2 = i; render(); } }, opt);
      }))));

    return [
      masthead(), scorebar(),
      h('section', { class: 'card case' },
        h('span', { class: 'tab' }, 'QUESTION ' + (S.qi + 1) + ' OF ' + TOTAL),
        wordClue(q),
        parts,
        h('div', { class: 'row' },
          h('button', { class: 'btn', type: 'button', disabled: !canSubmit(), onclick: submitAnswer }, 'Submit answer')))
    ];
  }

  function viewFeedback() {
    var q = curQ(), L = S.last, last = S.qi + 1 >= TOTAL;
    var cls = L.correct ? 'p3' : 'p0';
    var stamp = L.correct ? 'Case cracked' : 'Not quite';
    var spellLine = null;
    if (q.mode !== 'classify' && !L.part1ok) spellLine = h('p', { class: 'answerline' }, 'Correct spelling: ' + q.word);
    var posLine = !L.part2ok ? h('p', { class: 'answerline' }, 'Part of speech: ' + POS_OPTIONS[q.pos]) : null;
    return [
      masthead(), scorebar(),
      h('section', { class: 'card case' },
        h('span', { class: 'tab' }, 'QUESTION ' + (S.qi + 1) + ' OF ' + TOTAL),
        wordClue(q),
        h('div', { class: 'verdict' },
          h('span', { class: 'stamp ' + cls }, stamp),
          spellLine, posLine,
          h('div', { class: 'explainbox' }, q.explain)),
        h('div', { class: 'row' },
          h('button', { class: 'btn', type: 'button', id: 'nextbtn', onclick: advance }, last ? 'See my results' : 'Next question')))
    ];
  }

  function syncLine() {
    if (S.syncStatus === 'sending') return h('div', { class: 'syncline' }, 'Saving your results…');
    if (S.syncStatus === 'ok') return h('div', { class: 'syncline ok' }, 'Saved to your teacher’s tracker.');
    if (S.syncStatus === 'failed') return h('div', { class: 'syncline failed' }, 'Could not reach the tracker — show this screen to your teacher.');
    return h('div', { class: 'syncline' }, 'Tracker not connected yet — show this screen to your teacher.');
  }

  function viewDone() {
    var R = S.result;
    return [
      masthead(),
      h('section', { class: 'card final' },
        h('span', { class: 'stamp p3' }, 'Stage 1 complete'),
        h('div', { class: 'rank' }, R.score + ' of ' + TOTAL + ' correct'),
        h('p', { class: 'bigscore' }, S.name.toUpperCase() + ' · ' + S.id.toUpperCase()),
        h('p', { class: 'rankline' }, rankFor(R.score)),
        h('div', { class: 'statgrid' },
          h('div', { class: 'stat' }, h('b', null, R.totalSec + 's'), h('span', null, 'total time')),
          h('div', { class: 'stat' }, h('b', null, R.avgSec + 's'), h('span', null, 'avg / question')),
          h('div', { class: 'stat' }, h('b', null, R.fastest + 's'), h('span', null, 'fastest answer'))),
        syncLine(),
        h('div', { class: 'row' },
          h('button', { class: 'btn', type: 'button', onclick: playAgain }, 'Play again'),
          h('button', { class: 'btn ghost', type: 'button', onclick: switchStudent }, 'Different student'))),
      cskFooter()
    ];
  }

  function render() {
    var views = { start: viewStart, quiz: viewQuiz, feedback: viewFeedback, done: viewDone };
    var nodes = views[S.phase]().filter(Boolean);
    app.replaceChildren.apply(app, nodes);
    if (S.phase === 'start') { var idEl = document.getElementById('idinput'); if (idEl && !S.id) idEl.focus(); }
    if (S.phase === 'quiz' && curQ().mode === 'spell_type') { var sp = document.getElementById('spellinput'); if (sp) sp.focus(); }
    if (S.phase === 'feedback') { var nb = document.getElementById('nextbtn'); if (nb) nb.focus(); }
  }

  render();
})();
</script>
